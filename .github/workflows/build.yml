name: Android debug verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-debug:
    name: Test, lint and build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HermesBots

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run debug verification
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HermesBots-debug-${{ github.sha }}
          path: HermesBots/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
